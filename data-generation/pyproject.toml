[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evdata"
version = "1.0.0"
description = "Synthetic graph-city generator for EV charging placement"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "networkx>=3.0",
    "scipy>=1.11",
    "joblib>=1.3",
]

[project.scripts]
evdata = "evdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
